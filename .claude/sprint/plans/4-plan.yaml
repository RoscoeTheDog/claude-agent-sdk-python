rollout_strategy:
  phase_1: Add optional dependency and function (no breaking changes)
  phase_2: Test extensively on all platforms
  phase_3: Document in README and API reference
  phase_4: Consider making auto-oauth the default recommendation (future)

success_metrics:
  - All unit tests pass with >95% coverage
  - Manual testing succeeds on Windows, macOS, Linux
  - Error messages are clear and actionable
  - Auto-install completes in <5 minutes on typical network
  - No breaking changes to existing API
