# Test Strategy

## Approach

### 1. Platform Mocking Strategy
Use `platform.system()` patching consistently:
- Windows: `return_value="Windows"`
- macOS: `return_value="Darwin"`
- Linux: `return_value="Linux"`

Mock environment variables for Windows:
```python
patch.dict(os.environ, {
    "LOCALAPPDATA": "C:\\Users\\test\\AppData\\Local",
    "APPDATA": "C:\\Users\\test\\AppData\\Roaming"
})
```

### 2. Path Mocking Simplification
Replace complex lambda-based mocks with pytest fixtures:
```python
@pytest.fixture
def mock_paths(platform_name, paths_that_exist):
    # Return pre-configured mock for each platform
    # with specific paths set to exist
```

### 3. Exhaustive Platform Coverage
Create parameterized tests:
```python
@pytest.mark.parametrize("platform,path,expected", [
    ("Windows", "AppData/Local/npm/claude.cmd", True),
    ("Windows", "AppData/Roaming/npm/claude.cmd", True),
    ("Darwin", "/opt/homebrew/bin/claude", True),
    ("Darwin", "/usr/local/bin/claude", True),
    ("Linux", "/usr/local/bin/claude", True),
    # ... all 11+ paths
])
```

### 4. Error Message Content Verification
Add assertions for:
- Searched paths listed in error
- Platform-specific installation instructions
- Path count matches implementation

### 5. Integration Testing (CI)
- Add CI workflow step to install actual CLI (if available)
- Run subset of tests against real binary
- Use environment variable to enable/skip: `CLAUDE_CLI_INTEGRATION_TEST`
- Graceful skip if CLI installation fails in CI

