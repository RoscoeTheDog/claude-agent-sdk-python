## Additional Gaps Found

### Edge Cases Not Tested
1. **Path Priority Order**: Tests verify individual paths work but not priority/order
2. **Multiple CLIs Present**: What if multiple paths have claude? (first-found wins)
3. **Symlink Resolution**: Real-world Homebrew installs use symlinks
4. **Permission Errors**: What if path exists but not executable?
5. **Unicode/Special Characters**: Paths with spaces, unicode, etc.
6. **Environment Variable Edge Cases**:
