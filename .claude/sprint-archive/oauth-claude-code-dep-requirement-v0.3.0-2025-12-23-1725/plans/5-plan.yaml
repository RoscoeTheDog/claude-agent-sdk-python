# CI Integration Considerations

## GitHub Actions Strategy
```yaml
# Optional integration test job
integration-test:
  runs-on: ubuntu-latest
  continue-on-error: true  # Don't fail CI if claude-code unavailable
  steps:
    - name: Install Claude Code (optional)
      run: |
        npm install -g @anthropic-ai/claude-code || echo "Claude Code not available"
    - name: Run integration tests
      env:
        CLAUDE_CLI_INTEGRATION_TEST: "1"
      run: pytest tests/test_integration.py -v
```

## Multi-Platform CI Matrix
```yaml
test:
  strategy:
    matrix:
      os: [ubuntu-latest, macos-latest, windows-latest]
      python-version: ['3.10', '3.11', '3.12']
  runs-on: ${{ matrix.os }}
```

Benefits:
- Validates platform-specific paths on actual OS
- Catches platform-specific bugs (path separators, extensions)
- Tests Windows .cmd/.exe, macOS Homebrew, Linux system paths

## Fallback Strategy
If CI doesn't have Claude Code installed:
- Integration tests auto-skip via pytest.mark.skipif
- Unit tests with mocks still provide 95%+ coverage
- Optional manual testing documentation

