# Gitleaks configuration for detecting secrets
# Install: https://github.com/gitleaks/gitleaks

title = "Anthropic SDK OAuth - Secret Detection"

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{95}'''
tags = ["key", "anthropic"]

[[rules]]
id = "anthropic-oauth-access-token"
description = "Anthropic OAuth Access Token"
regex = '''sk-ant-oat[0-9]{2}-[A-Za-z0-9_-]{95}'''
tags = ["token", "anthropic", "oauth"]

[[rules]]
id = "anthropic-oauth-refresh-token"
description = "Anthropic OAuth Refresh Token"
regex = '''sk-ant-ort[0-9]{2}-[A-Za-z0-9_-]{95}'''
tags = ["token", "anthropic", "oauth"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret)['"\s]*[:=]['"\s]*[A-Za-z0-9_-]{20,}'''
tags = ["key", "generic"]

[[rules]]
id = "generic-secret"
description = "Generic Secret"
regex = '''(?i)(secret|password|passwd|token)['"\s]*[:=]['"\s]*[A-Za-z0-9_-]{20,}'''
tags = ["secret", "generic"]

[[rules]]
id = "credentials-json"
description = "Credentials JSON file"
regex = '''(accessToken|refreshToken|api_key|apiKey)["']?\s*:\s*["'][^"']{20,}["']'''
tags = ["credentials", "json"]

[allowlist]
description = "Allowlist for safe patterns"
paths = [
    '''.env.example''',
    '''.gitleaks.toml''',
    '''tests/fixtures/mock_*.json''',
]
regexes = [
    '''sk-ant-api-xxxxx''',  # Example placeholder
    '''sk-ant-oat01-xxxxx''', # Example placeholder
    '''sk-ant-ort01-xxxxx''', # Example placeholder
    '''your-key-here''',
    '''example.com''',
]
